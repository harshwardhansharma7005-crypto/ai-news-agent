name: Daily AI News

on:
  schedule:
    # GitHub cron uses UTC. 14:30 UTC = 20:00 Asia/Kolkata (IST = UTC+5:30).
    - cron: "30 14 * * *"

  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish to Facebook even if duplicate protection would skip"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  build-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI news post and publish to Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}

          FORCE_PUBLISH: ${{ github.event.inputs.force_publish == 'true' && '1' || '0' }}

        run: python main.py

      - name: Upload output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-news-output
          path: output/
          if-no-files-found: warn

      - name: Save output to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily AI news $(date -u +%Y-%m-%d)"

          git pull --rebase origin main
          git push
