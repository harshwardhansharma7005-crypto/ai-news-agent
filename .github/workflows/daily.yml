name: Daily AI News

on:
  schedule:
    # GitHub cron uses UTC. 14:30 UTC = 20:00 Asia/Kolkata (IST = UTC+5:30).
    - cron: "30 14 * * *"
  workflow_dispatch:   # lets you press "Run workflow" manually

permissions:
  contents: write      # needed so the job can save the output files to the repo

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  build-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI news post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: set a repository variable named GEMINI_MODEL to choose a model.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python main.py

      - name: Upload output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-news-output
          path: output/
          if-no-files-found: warn

      - name: Save output to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/daily_post.txt output/daily_news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily AI news $(date -u +%Y-%m-%d)"
            git push
          fi
